name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  MISE_ENV: ci
  MISE_IGNORED_CONFIG_PATHS: ~/.config/mise/config.toml

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Set up mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install: false
          cache: true

      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install mise tools
        run: mise install --locked

      - name: Verify repository
        run: mise run verify

  # The native credential addon is only embedded when the build host matches the
  # target, so each platform compiles on its own runner. All of these labels are
  # free for public repositories.
  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-latest
          - platform: darwin-x64
            runner: macos-15-intel
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: windows-x64
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Set up mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install: false
          cache: true

      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install mise tools
        run: mise install --locked

      - name: Compile ${{ matrix.platform }}
        run: mise run compile:binary ${{ matrix.platform }}

      - name: Upload ${{ matrix.platform }} binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.platform }}
          path: dist/binaries/raw/${{ matrix.platform }}/
          if-no-files-found: error
          retention-days: 1

  # musl needs a musl host: bun install resolves the addon by libc, and a glibc
  # runner would silently leave the musl binary without it.
  build-musl:
    needs: verify
    runs-on: ubuntu-24.04
    container: oven/bun:1.4.0-alpine
    steps:
      - name: Install checkout prerequisites
        run: apk add --no-cache git

      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compile linux-x64-musl
        run: bun mise-tasks/compile/binary.ts linux-x64-musl

      - name: Upload linux-x64-musl binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-x64-musl
          path: dist/binaries/raw/linux-x64-musl/
          if-no-files-found: error
          retention-days: 1

  binaries:
    needs: [build, build-musl]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Set up mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install: false
          cache: true

      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install mise tools
        run: mise install --locked

      - name: Download platform binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist/binaries/raw

      - name: Package archives
        run: mise run compile:archives

      - name: Upload rolling v0.0.0 binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise run release:binaries

  changesets:
    needs: [build, build-musl]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Set up mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install: false
          cache: true

      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install mise tools
        run: mise install --locked

      - name: Pack dry-run
        run: mise run pack

      - name: Mint Version Packages token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.CHANGESET_VERSION_APP_CLIENT_ID }}
          private-key: ${{ secrets.CHANGESET_VERSION_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create Version Packages PR
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: mise run version
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
          github-token: ${{ steps.app-token.outputs.token }}
          setupGitUser: false
          commitMode: github-api
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Download platform binaries
        if: steps.changesets.outputs.hasChangesets == 'false'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist/binaries/raw

      - name: Publish
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: mise run release

      - name: Smoke npm distribution
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: mise run release:smoke

      - name: Tag and create GitHub Release
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: mise run release:tags
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload versioned binaries
        if: steps.changesets.outputs.hasChangesets == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise run release:versioned-binaries
